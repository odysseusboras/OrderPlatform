<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,26 L500,58"/>
    <path d="M400,92 L242,92"/>
    <path d="M240,124 L398,124"/>
    <path d="M600,105 L778,105"/>
    <path d="M500,150 L500,248"/>
    <path d="M600,295 L778,295"/>
    <path d="M140,140 L140,258"/>
    <path d="M420,150 L232,258"/>
    <path d="M400,295 L242,295"/>
  </g>
  <circle cx="500" cy="18" r="8" fill="#1f2937"/>
  <g stroke-width="1.6">
    <rect x="40" y="70" width="200" height="70" rx="8" fill="#eef4fb" stroke="#1f4e79"/>
    <rect x="400" y="60" width="200" height="90" rx="8" fill="#eef4fb" stroke="#1f4e79"/>
    <rect x="400" y="250" width="200" height="90" rx="8" fill="#eef4fb" stroke="#1f4e79"/>
    <rect x="780" y="70" width="180" height="70" rx="8" fill="#edf7ee" stroke="#2e7d32"/>
    <rect x="785" y="75" width="170" height="60" rx="5" fill="none" stroke="#2e7d32" stroke-width="1"/>
    <rect x="780" y="260" width="180" height="70" rx="8" fill="#edf7ee" stroke="#2e7d32"/>
    <rect x="785" y="265" width="170" height="60" rx="5" fill="none" stroke="#2e7d32" stroke-width="1"/>
    <rect x="40" y="260" width="200" height="70" rx="8" fill="#fdf1e7" stroke="#b45309"/>
  </g>
  <g font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">
    <text x="140" y="102">Waiting</text>
    <text x="500" y="92">Running</text>
    <text x="500" y="282">Compensating</text>
    <text x="870" y="102">Completed</text>
    <text x="870" y="292">Compensated</text>
    <text x="140" y="292">RequiresAttention</text>
  </g>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="140" y="122">an on-demand step waits</text>
    <text x="500" y="112">one step per move;</text>
    <text x="500" y="128">a retryable error waits, then retries</text>
    <text x="500" y="302">undoes one succeeded step</text>
    <text x="500" y="318">per move, in reverse order</text>
    <text x="870" y="122">final: every step ran</text>
    <text x="870" y="312">final: everything undone</text>
    <text x="140" y="312">stopped: a person decides</text>
  </g>
  <g font-size="12.5" fill="#1f2937">
    <text x="320" y="84" text-anchor="middle">step returns Waiting</text>
    <text x="320" y="142" text-anchor="middle">triggered</text>
    <text x="689" y="97" text-anchor="middle">last step done</text>
    <text x="512" y="194">fatal error or cancel,</text>
    <text x="512" y="210">before the pivot</text>
    <text x="689" y="287" text-anchor="middle">nothing left to undo</text>
    <text x="150" y="204">timeout</text>
    <text x="364" y="206">retries ran out,</text>
    <text x="364" y="222">or fatal error</text>
    <text x="364" y="238">after the pivot</text>
    <text x="320" y="287" text-anchor="middle">an undo failed for good</text>
  </g>
